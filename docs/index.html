<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>La Farigoule, journal de la maison</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 14 C8 9 9 5 13 2' stroke='%237d955c' stroke-width='1.3' fill='none' stroke-linecap='round'/><path d='M0 0 C3 -2 7 -2 10 0 C7 2 3 2 0 0 Z' transform='translate(8 8) rotate(-40)' fill='%238ba664'/><path d='M0 0 C3 -2 7 -2 10 0 C7 2 3 2 0 0 Z' transform='translate(9.5 4.5) rotate(-40)' fill='%238ba664'/><path d='M0 0 C3 -2 7 -2 10 0 C7 2 3 2 0 0 Z' transform='translate(8.5 6) rotate(150)' fill='%238ba664'/><ellipse cx='6' cy='12' rx='2.6' ry='3.2' fill='%2333502e'/></svg>">
</head>
<body>

<div id="porte" class="porte">
  <form id="form-mdp" class="carte-mdp">
    <p class="marque">
      <img src="olivier.svg" alt="" class="rameau">
      <span>La Farigoule</span>
      <img src="olivier.svg" alt="" class="rameau miroir">
    </p>
    <p class="sous-titre">Journal de la maison &middot; Grasse</p>
    <label for="mdp">Mot de passe</label>
    <input type="password" id="mdp" autocomplete="current-password" autofocus>
    <button type="submit" id="bouton-entrer">Entrer</button>
    <p id="erreur-mdp" class="erreur" role="alert" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header class="entete">
    <div class="titre-zone">
      <h1><img src="olivier.svg" alt="" class="rameau-mini"> La Farigoule</h1>
      <p class="sous-titre" id="resume"></p>
    </div>
    <div class="recherche-zone">
      <input type="search" id="recherche" placeholder="Rechercher dans le journal…"
             autocomplete="off" spellcheck="false">
      <span id="compteur" class="compteur"></span>
      <span class="navigation-occurrences" id="navigation-occurrences" hidden>
        <button type="button" id="occ-precedente" title="Occurrence précédente (Maj+Entrée)"
                aria-label="Occurrence précédente">&#8249;</button>
        <button type="button" id="occ-suivante" title="Occurrence suivante (Entrée)"
                aria-label="Occurrence suivante">&#8250;</button>
      </span>
    </div>
  </header>

  <div class="corps">
    <nav class="frise" id="frise" aria-label="Chronologie"></nav>
    <main class="lecture" id="lecture"></main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
